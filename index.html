<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAISON DE LUXE | Ultra Luxury Flagship</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #dfb76c; 
            --gold-bright: #f5d77f; 
            --gold-glow: rgba(223, 183, 108, 0.3); 
            --dark-bg: #070709; 
            --card-bg: #12131a; 
            --text-light: #f1f1f5; 
            --border-gold: rgba(223, 183, 108, 0.25);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--dark-bg); color: var(--text-light); font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        h1, h2, h3, .brand-text { font-family: 'Cinzel', serif; letter-spacing: 2px; }

        .gold-ribbon { background: linear-gradient(90deg, #b8860b, var(--gold-bright), #b8860b); color: #000; text-align: center; padding: 8px 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; width: 100%; }

        header { background: rgba(7, 7, 9, 0.98); border-bottom: 1px solid var(--border-gold); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); width: 100%; }
        .nav-wrapper { display: flex; flex-direction: column; align-items: center; padding: 12px 4%; max-width: 1500px; margin: auto; width: 100%; gap: 10px; }
        .nav-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .brand-text { font-size: 20px; font-weight: 900; color: var(--gold); text-decoration: none; text-shadow: 0 0 15px var(--gold-glow); cursor: pointer; }
        
        .search-container { position: relative; width: 100%; max-width: 220px; }
        .search-container input { width: 100%; padding: 6px 30px 6px 12px; background: #12131a; border: 1px solid var(--border-gold); border-radius: 20px; color: #fff; font-size: 11px; outline: none; }
        .search-container i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 11px; }

        nav { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        nav::-webkit-scrollbar { display: none; }
        nav ul { display: flex; gap: 8px; list-style: none; justify-content: flex-start; min-width: max-content; padding: 4px 0; }
        nav ul li a { text-decoration: none; color: var(--text-light); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; padding: 5px 10px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid transparent; }
        nav ul li a:hover, nav ul li a.active { color: var(--gold); background: rgba(223, 183, 108, 0.15); border-color: var(--border-gold); }

        .cart-trigger { position: relative; cursor: pointer; font-size: 16px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
        .badge { background: var(--gold); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 50%; }

        @media (min-width: 768px) {
            .nav-wrapper { flex-direction: row; justify-content: space-between; padding: 15px 5%; gap: 0; }
            .brand-text { font-size: 26px; }
            nav { width: auto; }
            nav ul { gap: 15px; }
        }

        .page-view { display: none; width: 100%; animation: fadeIn 0.4s ease-in-out; }
        .page-view.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hero { 
            width: 100% !important; min-height: 55vh; 
            background: linear-gradient(180deg, rgba(7,7,9,0.5) 0%, var(--dark-bg) 100%), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 15px; border-bottom: 1px solid var(--border-gold);
        }
        .hero-tag { border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 30px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .hero h1 { font-size: 24px; color: #fff; margin-bottom: 12px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .hero p { color: #aaa; font-size: 12px; max-width: 600px; margin-bottom: 20px; line-height: 1.5; }

        .btn-gold { background: linear-gradient(135deg, var(--gold), #99752b); color: #000; font-weight: 800; padding: 12px 28px; border: none; border-radius: 40px; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; cursor: pointer; transition: 0.4s; text-decoration: none; box-shadow: 0 0 20px var(--gold-glow); display: inline-block; text-align: center; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 0 30px var(--gold); background: #fff; color: #000; }

        .trust-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; background: var(--card-bg); border-y: 1px solid var(--border-gold); padding: 12px; margin-bottom: 25px; font-size: 10px; color: #ccc; text-align: center; }
        .trust-item i { color: var(--gold); margin-right: 5px; font-size: 12px; }

        .store-section { padding: 30px 4%; max-width: 1500px; margin: auto; width: 100%; }
        .section-head { text-align: center; margin-bottom: 25px; }
        .section-head h2 { font-size: 22px; color: var(--gold); margin-bottom: 8px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; justify-content: center; width: 100%; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-gold); border-radius: 14px; overflow: hidden; transition: 0.4s; position: relative; width: 100%; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(223, 183, 108, 0.15); }
        .img-container { height: 300px; width: 100%; overflow: hidden; position: relative; background: #000; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; display: block; }
        .exclusive-badge { position: absolute; top: 10px; left: 10px; background: rgba(7, 7, 9, 0.85); border: 1px solid var(--gold); color: var(--gold); font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; z-index: 2; }

        .card-body { padding: 16px; text-align: center; width: 100%; }
        .card-body h3 { font-size: 15px; color: #fff; margin-bottom: 4px; }
        .rating-box { color: var(--gold-bright); font-size: 10px; margin-bottom: 6px; }
        .card-body .price { color: var(--gold-bright); font-weight: 700; font-size: 15px; margin-bottom: 10px; }
        
        .option-group { margin-bottom: 10px; text-align: left; font-size: 11px; color: #aaa; }
        .option-group label { display: block; margin-bottom: 4px; color: var(--gold); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
        
        .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-btn { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.3s; position: relative; }
        .color-btn.active { border-color: var(--gold); transform: scale(1.25); box-shadow: 0 0 10px var(--gold-glow); }
        
        .size-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .size-box { background: #181a24; border: 1px solid #333; color: #ccc; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; min-width: 30px; text-align: center; }
        .size-box.active { border-color: var(--gold); color: var(--gold); background: rgba(223, 183, 108, 0.2); }
        .size-detail-text { font-size: 10px; color: var(--gold-bright); margin-top: 4px; font-weight: 600; display: none; }

        .qty-control { display: flex; align-items: center; gap: 8px; background: #181a24; border: 1px solid #333; border-radius: 6px; width: fit-content; padding: 3px 6px; }
        .qty-btn { background: transparent; border: none; color: var(--gold); font-size: 13px; font-weight: 800; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-size: 11px; font-weight: 700; color: #fff; min-width: 14px; text-align: center; }

        .validation-error { color: #ff5555; font-size: 10px; font-weight: 600; margin-top: 6px; display: none; }

        .btn-add-cart { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px; border-radius: 30px; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-add-cart:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold-glow); }

        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 380px; height: 100%; background: #0c0d12; border-left: 1px solid var(--border-gold); z-index: 2000; transition: 0.4s ease-in-out; padding: 18px; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,0.9); }
        .cart-drawer.active { right: 0; }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-gold); padding-bottom: 10px; margin-bottom: 12px; color: var(--gold); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 3000; backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }
        .modal-content { background: #12131a; border: 1px solid var(--gold); border-radius: 16px; max-width: 480px; width: 100%; padding: 22px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.9); margin: auto; max-height: 90vh; overflow-y: auto; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--gold); border-bottom: 1px solid var(--border-gold); padding-bottom: 8px; }
        .form-row { display: flex; gap: 10px; }
        .form-group { margin-bottom: 10px; text-align: left; flex: 1; }
        .form-group label { display: block; font-size: 10px; color: #aaa; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; background: #070709; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 11px; outline: none; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }

        .payment-methods { display: flex; gap: 8px; margin-top: 6px; }
        .pay-card { flex: 1; background: #070709; border: 1px solid #333; border-radius: 6px; padding: 6px; text-align: center; font-size: 10px; color: #ccc; cursor: pointer; transition: 0.3s; }
        .pay-card.active { border-color: var(--gold); color: var(--gold); background: rgba(223, 183, 108, 0.1); }

        /* Floating Concierge & AI Buttons */
        .contact-float { position: fixed; bottom: 20px; left: 20px; background: linear-gradient(135deg, var(--gold), #99752b); color: #000; padding: 9px 16px; border-radius: 30px; font-weight: 800; font-size: 10px; text-transform: uppercase; z-index: 1000; text-decoration: none; box-shadow: 0 5px 20px rgba(223,183,108,0.4); display: flex; align-items: center; gap: 6px; }
        .ai-float { position: fixed; bottom: 20px; right: 20px; background: #181a24; color: var(--gold); border: 1px solid var(--gold); padding: 9px 16px; border-radius: 30px; font-weight: 800; cursor: pointer; z-index: 1000; text-transform: uppercase; font-size: 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }

        /* AI Chat Box */
        .ai-box { display: none; position: fixed; bottom: 70px; right: 20px; width: 290px; background: #101117; border: 1px solid var(--gold); border-radius: 14px; z-index: 2000; box-shadow: 0 20px 40px rgba(0,0,0,0.8); overflow: hidden; }
        .ai-header { background: linear-gradient(90deg, #070709, #1a1c26); color: var(--gold); padding: 10px 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-gold); font-family: 'Cinzel', serif; font-size: 11px; }
        .ai-body { height: 200px; padding: 10px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 8px; }
        .ai-msg { padding: 8px 10px; border-radius: 8px; line-height: 1.4; max-width: 85%; }
        .msg-bot { background: #191b26; color: #ddd; align-self: flex-start; border-top-left-radius: 2px; }
        .msg-user { background: var(--gold); color: #000; align-self: flex-end; border-top-right-radius: 2px; font-weight: 600; }
        .ai-footer { display: flex; border-top: 1px solid var(--border-gold); background: #070709; }
        .ai-footer input { flex: 1; padding: 8px; background: transparent; border: none; color: #fff; font-size: 11px; outline: none; }
        .ai-footer button { padding: 8px 14px; background: var(--gold); color: #000; border: none; font-weight: 800; cursor: pointer; font-size: 10px; }
    </style>
</head>
